<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tumble feedback</title>
<meta name="description" content="Let us know what you think of Tumble.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf8;
    --ink: #1a1a1a;
    --ink-dim: #63625c;
    --accent: #d1590f;
    --accent-soft: #fbe4d2;
    --line: #e8e5df;
    --card-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15141a;
      --ink: #f2f0eb;
      --ink-dim: #a9a69e;
      --accent: #ff9752;
      --accent-soft: #3a2a1e;
      --line: #2c2a30;
      --card-bg: #1d1c22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.4rem;
  }
  .intro {
    color: var(--ink-dim);
    margin: 0 0 2.2rem;
    font-size: 1rem;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 1.8rem;
  }
  legend {
    font-weight: 600;
    margin-bottom: 0.7rem;
    padding: 0;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .choice {
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--ink);
    padding: 0.55rem 1rem;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .choice.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  label.field-label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  textarea, input[type="email"] {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea {
    min-height: 6rem;
    resize: vertical;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin-top: 0.4rem;
  }
  button[type="submit"] {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  #status.error {
    color: #c0392b;
  }
  #thanks {
    text-align: center;
    padding: 3rem 0;
  }
  #thanks h1 {
    margin-bottom: 0.6rem;
  }
  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
<main>
  <div id="form-wrap">
    <h1>What do you think of Tumble?</h1>
    <p class="intro">Two minutes, no account needed. Anonymous unless you enter your email.</p>

    <form id="feedback-form">
      <fieldset>
        <legend>What do you think so far?</legend>
        <div class="choices" data-field="sentiment">
          <button type="button" class="choice" data-value="Love it">😍 Love it</button>
          <button type="button" class="choice" data-value="It's fine">🙂 It's fine</button>
          <button type="button" class="choice" data-value="Could be better">😐 Could be better</button>
          <button type="button" class="choice" data-value="Not for me">😕 Not for me</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>How disappointed would you be if Tumble disappeared tomorrow?</legend>
        <div class="choices" data-field="disappointment">
          <button type="button" class="choice" data-value="Very disappointed">Very disappointed</button>
          <button type="button" class="choice" data-value="Somewhat disappointed">Somewhat</button>
          <button type="button" class="choice" data-value="Not disappointed">Not disappointed</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>How often do you use it?</legend>
        <div class="choices" data-field="frequency">
          <button type="button" class="choice" data-value="Daily">Daily</button>
          <button type="button" class="choice" data-value="A few times a week">A few times a week</button>
          <button type="button" class="choice" data-value="Once in a while">Once in a while</button>
          <button type="button" class="choice" data-value="Not really yet">Not really yet</button>
        </div>
      </fieldset>

      <fieldset>
        <label class="field-label" for="suggestion">Suggestions, confusion, anything that bugs you?</label>
        <textarea id="suggestion" name="suggestion" placeholder="Everything is welcome, even small things."></textarea>
      </fieldset>

      <fieldset>
        <label class="field-label" for="email">Email (optional, in case I have follow-up questions)</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
      </fieldset>

      <button type="submit" id="submit-btn">Send</button>
      <p id="status" role="status"></p>
    </form>
  </div>

  <div id="thanks" hidden>
    <h1>Thanks! 🙏</h1>
    <p class="intro">Your feedback has been sent — that's genuinely useful to me.</p>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://johanlijffijt.dev/supabase';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4NjUwNTE1LCJleHAiOjE5NDYzMzA1MTV9.3XlYAzs0hWK8gBlHRlVTQWv2IZWH4dPhKyJDJtZvkF8';

  const answers = { sentiment: null, disappointment: null, frequency: null };

  document.querySelectorAll('.choices').forEach((group) => {
    const field = group.dataset.field;
    group.querySelectorAll('.choice').forEach((btn) => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.choice').forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[field] = btn.dataset.value;
      });
    });
  });

  const form = document.getElementById('feedback-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = '';

    const body = {
      sentiment: answers.sentiment,
      disappointment: answers.disappointment,
      frequency: answers.frequency,
      suggestion: document.getElementById('suggestion').value.trim() || null,
      email: document.getElementById('email').value.trim() || null,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/feedback', {
        method: 'POST',
        headers: {
          apikey: ANON_KEY,
          Authorization: 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) throw new Error('Send failed (' + res.status + ')');

      document.getElementById('form-wrap').hidden = true;
      document.getElementById('thanks').hidden = false;
    } catch (err) {
      statusEl.textContent = 'Something went wrong — please try again.';
      statusEl.className = 'error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send';
    }
  });
</script>
</body>
</html>
