<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237c3aed'/%3E%3Cpath d='M13 10l10 6-10 6z' fill='white'/%3E%3C/svg%3E">
<title>Feedback — Johan's Indie Arcade</title>
<meta name="description" content="Found a bug, have a game idea, or just want to say hi? Send it straight to Johan.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9fd;
    --ink: #1c1a24;
    --ink-dim: #6b687a;
    --accent: #7c3aed;
    --line: #e7e3f0;
    --card-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16141f;
      --ink: #f3f1f9;
      --ink-dim: #a8a4b8;
      --accent: #a78bfa;
      --line: #332c47;
      --card-bg: #201c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }
  a { color: var(--accent); }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.4rem;
  }
  .intro {
    color: var(--ink-dim);
    margin: 0 0 2.2rem;
    font-size: 1rem;
  }
  label.field-label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 1.4rem;
  }
  textarea, input[type="email"] {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea {
    min-height: 8rem;
    resize: vertical;
  }
  button[type="submit"] {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  #status.error {
    color: #c0392b;
  }
  #thanks {
    text-align: center;
    padding: 3rem 0;
  }
  #thanks h1 {
    margin-bottom: 0.6rem;
  }
  .back {
    display: inline-block;
    margin-bottom: 2rem;
    font-size: 0.9rem;
    color: var(--ink-dim);
    text-decoration: none;
  }
  [hidden] {
    display: none !important;
  }
  #staging-banner {
    background: #f5a623;
    color: #1a1300;
    font-weight: 700;
    text-align: center;
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
  }
  #staging-banner a {
    color: #1a1300;
    text-decoration: underline;
  }
</style>
</head>
<body>
<!-- Site root is shared between johanlijffijt.dev and staging.johanlijffijt.dev — hidden by
     default, JS only un-hides it when the hostname actually contains "staging" (fails safe). -->
<div id="staging-banner" hidden>
  ⚠️ STAGING OMGEVING — dit is een testversie. Productie draait op
  <a href="https://johanlijffijt.dev">johanlijffijt.dev</a>
</div>
<script>
  if (window.location.hostname.includes('staging')) {
    document.getElementById('staging-banner').hidden = false;
  }
</script>
<main>
  <a class="back" href="/">← Back to the arcade</a>
  <div id="form-wrap">
    <h1>Bug, idea, or just saying hi?</h1>
    <p class="intro">Whether it's a broken game, a feature you'd love, or a game you wish existed — it goes straight to Johan.</p>

    <form id="feedback-form">
      <fieldset>
        <label class="field-label" for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's up?" required></textarea>
      </fieldset>

      <fieldset>
        <label class="field-label" for="email">Your email (optional, so I can reply)</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
      </fieldset>

      <button type="submit" id="submit-btn">Send</button>
      <p id="status" role="status"></p>
    </form>
  </div>

  <div id="thanks" hidden>
    <h1>Thanks! 🙏</h1>
    <p class="intro">Your message has been sent.</p>
  </div>
</main>

<script>
  const form = document.getElementById('feedback-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = '';

    const body = {
      message: document.getElementById('message').value.trim(),
      email: document.getElementById('email').value.trim() || null,
    };

    if (!body.message) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) throw new Error('Send failed (' + res.status + ')');

      document.getElementById('form-wrap').hidden = true;
      document.getElementById('thanks').hidden = false;
    } catch (err) {
      statusEl.textContent = 'Something went wrong — please try again.';
      statusEl.className = 'error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send';
    }
  });
</script>
</body>
</html>
