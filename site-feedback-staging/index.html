<title>Feedback — johanlijffijt.dev Tools & Calculators</title>
<meta name="description" content="Klopt een berekening niet, mis je een materiaalsoort, of heb je een idee voor een nieuwe tool? Laat het direct weten.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: light;
    --bg: #f8fafc;
    --ink: #0f172a;
    --ink-dim: #475569;
    --accent: #10b981;
    --accent-dark: #059669;
    --accent-soft: #ecfdf5;
    --line: #e2e8f0;
    --card-bg: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.06);
    --amber-bg: #fef3c7;
    --amber-ink: #92400e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }
  a { color: var(--accent-dark); }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.4rem;
    color: var(--ink);
  }
  .intro {
    color: var(--ink-dim);
    margin: 0 0 2.2rem;
    font-size: 1rem;
  }
  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
  }
  label.field-label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 0.5rem;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 1.4rem;
  }
  textarea, input[type="email"] {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea:focus, input[type="email"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea {
    min-height: 8rem;
    resize: vertical;
  }
  button[type="submit"] {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 0.5rem;
    min-height: 44px;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--accent-dark); }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  #status.error {
    color: #dc2626;
  }
  #thanks {
    text-align: center;
    padding: 3rem 0;
  }
  #thanks h1 {
    margin-bottom: 0.6rem;
  }
  .back {
    display: inline-block;
    margin-bottom: 2rem;
    font-size: 0.9rem;
    color: var(--ink-dim);
    text-decoration: none;
  }
  .back:hover { color: var(--accent-dark); }
  [hidden] {
    display: none !important;
  }
  .staging-banner {
    background: var(--amber-bg);
    color: var(--amber-ink);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    padding: 0.6rem 1rem;
  }
</style>
</head>
<body>

  <div class="staging-banner">⚠️ STAGING — testomgeving, niet gepubliceerd voor bezoekers</div>

  <main>
    <a class="back" href="/">← Terug naar Tools & Calculators</a>
    <div id="form-wrap">
      <h1>Feedback of een tool-idee?</h1>
      <p class="intro">Klopt een berekening niet, mis je een materiaalsoort, of heb je een idee
        voor een nieuwe tool? Het komt direct bij Johan terecht.</p>

      <div class="form-card">
        <form id="feedback-form">
          <fieldset>
            <label class="field-label" for="message">Bericht</label>
            <textarea id="message" name="message" placeholder="Waar loop je tegenaan?" required></textarea>
          </fieldset>

          <fieldset>
            <label class="field-label" for="email">Je e-mailadres (optioneel, zodat ik kan reageren)</label>
            <input type="email" id="email" name="email" placeholder="jij@voorbeeld.nl">
          </fieldset>

          <button type="submit" id="submit-btn">Versturen</button>
          <p id="status" role="status"></p>
        </form>
      </div>
    </div>

    <div id="thanks" hidden>
      <h1>Bedankt! 🙏</h1>
      <p class="intro">Je bericht is verstuurd.</p>
    </div>
  </main>

  <script>
    const form = document.getElementById('feedback-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.className = '';

      const body = {
        message: document.getElementById('message').value.trim(),
        email: document.getElementById('email').value.trim() || null,
      };

      if (!body.message) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Versturen...';

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) throw new Error('Send failed (' + res.status + ')');

        document.getElementById('form-wrap').hidden = true;
        document.getElementById('thanks').hidden = false;
      } catch (err) {
        statusEl.textContent = 'Er ging iets mis — probeer het nog eens.';
        statusEl.className = 'error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Versturen';
      }
    });
  </script>
</body>
</html>
