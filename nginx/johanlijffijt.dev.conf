server {
    server_name johanlijffijt.dev www.johanlijffijt.dev;

    root /home/johan/projects/johanlijffijt-dev/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Meteor Dodge (browsergame, ~/projects/apps/meteor-dodge/) — statische Vite/Phaser-build,
    # gedeployed via `npm run deploy` in dat project naar site/game/. Losse location alleen voor
    # de lang-cachebare, content-hashed assets van Vite (index.html zelf moet altijd vers zijn).
    location /game/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /tumble/ios {
        return 302 https://expo.dev/accounts/johanlijffijt/projects/streakly/updates/a2253794-e689-4313-99b5-e79810783789;
    }

    location = /tumble/android {
        return 302 https://expo.dev/accounts/johanlijffijt/projects/streakly/updates/666bc93f-d6d3-48af-8765-1c1f38f580c4;
    }

    # HTTPS-proxy naar de self-hosted Supabase-gateway (draait alleen op platte HTTP op
    # 127.0.0.1:8000) — nodig omdat browsers een fetch() naar http:// vanaf een https-pagina
    # blokkeren als mixed content. Client-side code moet naar /supabase/... wijzen, niet naar
    # http://51.68.189.167:8000 rechtstreeks.
    # Sinds de pivot naar games (12 sept 2026) alleen nog gebruikt door Tumble's eigen
    # (on hold) site/tumble/feedback|contact — die Supabase-stack is gestopt, dus dit geeft
    # nu een 502 totdat Tumble weer wordt opgepakt. Bewust laten staan i.p.v. verwijderen: geen
    # schade in stilstand, en scheelt herbedraden als Tumble ooit weer actief wordt.
    location /supabase/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eigen lichtgewicht backend voor de arcade-hub zelf (feedback + click-tracking), losgekoppeld
    # van Tumble's Supabase (12 sept 2026, zie CLAUDE.md § Eigen backend). Draait als Docker-
    # container (`api/docker-compose.yml`) op 127.0.0.1:8787, alleen bereikbaar via deze proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/johanlijffijt.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/johanlijffijt.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.johanlijffijt.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = johanlijffijt.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name johanlijffijt.dev www.johanlijffijt.dev;
    return 404; # managed by Certbot




}

# Staging (12 september 2026, zie CLAUDE.md § Staging-omgeving) — deelt de root met productie
# (zelfde homepage/feedback/robots.txt/etc., geen aparte kopie om uit sync te raken), maar
# /game/ wijst via `alias` naar een aparte staging-build zodat een game-iteratie hier getest kan
# worden vóór die naar site/game/ (productie) gaat. Nog geen HTTPS — certbot moet hiervoor nog
# handmatig gedraaid worden (root nodig, buiten de passwordless-sudo-scope van deze sessie):
#   sudo certbot --nginx -d staging.johanlijffijt.dev
# Certbot voegt daarna zelf de 443/ssl-blokken toe, zelfde patroon als hierboven.
server {
    server_name staging.johanlijffijt.dev;

    root /home/johan/projects/johanlijffijt-dev/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Homepage volledig gescheiden van productie (13 september 2026, op Johans verzoek —
    # "staging en productie moeten gescheiden zijn", na een incident waarbij een staging-only
    # arcade-kaart via de gedeelde site/index.html ook op productie verscheen). Alleen de
    # homepage zelf; /feedback/, robots.txt, images/ etc. blijven gedeeld via de root hierboven.
    #
    # De indirectie via try_files + een named location is bewust, geen overbodige omweg: zowel
    # `alias .../site-staging/index.html;` als `root .../site-staging;` direct in `location = /`
    # bleken onbetrouwbaar (respectievelijk een 500 en stil terugvallen op het bovenliggende
    # `site/`-root) — een bekende nginx-valkuil rond root/index-resolutie specifiek bij een exacte
    # match op "/". `alias` mag bovendien niet in een named location (`@...`); `root` + `try_files`
    # met een expliciet, volledig pad wél — dat is de combinatie die hier daadwerkelijk werkt,
    # herhaaldelijk geverifieerd met curl.
    location = / {
        try_files /nonexistent-marker @staging_home;
    }

    location @staging_home {
        root /home/johan/projects/johanlijffijt-dev;
        try_files /site-staging/index.html =404;
    }

    # Browsergames-episode definitief stopgezet (14 september 2026, zie CLAUDE.md) — de oude
    # /game/ en /games/<slug>/ staging-locations (Meteor Survivor, Neon Drift, Gravity Flip,
    # Marble Jam) zijn verwijderd. De statische build-mappen (site-game-staging/,
    # site-*-staging/) staan nog op schijf maar worden niet meer geserveerd; zie git-historie voor
    # het volledige oude config-blok.

    # Tools & Calculators (nieuwe focus sinds 14 september 2026, zie CLAUDE.md). Elke tool is een
    # los, statisch HTML-bestand zonder build-stap — bewerken in site-tools-staging/ is de deploy,
    # nginx serveert meteen de nieuwste versie. Staging-only zolang er geen "GO voor productie" is
    # — geen equivalent location-blok in het productie-serverblok hierboven, per de Gouden Regel.
    location /tools/ {
        alias /home/johan/projects/johanlijffijt-dev/site-tools-staging/;
        try_files $uri $uri/ =404;
    }

    # Feedback-pagina (14 september 2026) — was tot dusver één bestand gedeeld met productie
    # (site/feedback/), maar dat betekent dat elke wijziging hier direct ook op productie
    # verschijnt. Zelfde scheidingstechniek toegepast als bij /tools/ en de homepage: een aparte
    # staging-only kopie, geen equivalent location-blok in het productie-serverblok.
    location /feedback/ {
        alias /home/johan/projects/johanlijffijt-dev/site-feedback-staging/;
        try_files $uri $uri/ =404;
    }

    # Zelfde backend als productie (feedback/click-tracking) — de gedeelde homepage/feedback-
    # pagina heeft deze proxy ook op staging nodig, anders werken die formulieren hier niet.
    # Bewuste keuze: geen aparte staging-backend/database, dus test-inzendingen vanaf staging
    # komen in dezelfde api/data/*.ndjson terecht als productie — acceptabel voor een project van
    # deze schaal, met één persoon die zelf test.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.johanlijffijt.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.johanlijffijt.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = staging.johanlijffijt.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name staging.johanlijffijt.dev;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}